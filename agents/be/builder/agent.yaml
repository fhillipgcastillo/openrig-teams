name: be-builder
version: "1.0"
description: "BE builder: implements the assigned job in its worktree"

defaults:
  runtime: codex

imports:
  - ref: local:../../shared

profiles:
  default:
    uses:
      skills: [development-team, test-driven-development, systematic-debugging, verification-before-completion]
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:codex-default-config]

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
