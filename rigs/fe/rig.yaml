version: "0.2"
name: fe
summary: >
  FE department template, generated per worktree by bin/rig-team: builder, reviewer, tester.
culture_file: CULTURE.md

pods:
  - id: team
    label: FE team
    members:
      - id: builder
        agent_ref: "local:../../agents/fe/builder"
        runtime: codex
        codex_config_profile: openrig-auto
        profile: default
        cwd: "."
      - id: reviewer
        agent_ref: "local:../../agents/fe/reviewer"
        runtime: codex
        codex_config_profile: openrig-auto
        profile: default
        cwd: "."
      - id: tester
        agent_ref: "local:../../agents/fe/tester"
        runtime: codex
        codex_config_profile: openrig-auto
        profile: default
        cwd: "."
    edges:
      - kind: delegates_to
        from: builder
        to: reviewer
      - kind: delegates_to
        from: builder
        to: tester

edges: []
